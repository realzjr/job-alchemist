<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工位炼金师</title></head>
<body style="margin:0;background:#1a1410;color:#d8c8a2;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif">
<div id="ld" style="text-align:center;font-size:14px;letter-spacing:2px">加载中…</div>
<script>
const N=2,V='54320b21';
Promise.all([...Array(N)].map((_,i)=>fetch('p'+(i+1)+'.bin?v='+V).then(r=>r.arrayBuffer())))
.then(async ps=>{const html=new TextDecoder().decode(await new Blob(ps).arrayBuffer());document.open();document.write(html);document.close();})
.catch(e=>{document.getElementById('ld').textContent='加载失败，请刷新重试 ('+e+')'});
</script></body></html>
